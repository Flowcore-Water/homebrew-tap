name: Validate Formulae
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ github.token }}
      - name: Audit formulae
        run: |
          for f in Formula/*.rb; do
            formula="flowcore-water/tap/$(basename "$f" .rb)"
            brew style "$formula"
            brew audit --strict "$formula"
          done
