name: Validate Formulae
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Audit formulae
        run: |
          brew untap flowcore-water/tap 2>/dev/null || true
          brew tap-new flowcore-water/tap --no-git
          cp -r Formula "$(brew --repository)/Library/Taps/flowcore-water/homebrew-tap/Formula"
          for f in Formula/*.rb; do
            formula="flowcore-water/tap/$(basename "$f" .rb)"
            brew style "$formula"
            brew audit --strict "$formula"
          done
