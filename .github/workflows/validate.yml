name: Validate Formulae
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Homebrew
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
      - name: Audit formulae
        run: |
          brew untap flowcore-water/tap 2>/dev/null || true
          brew tap-new flowcore-water/tap --no-git
          cp -r Formula "$(brew --repository)/Library/Taps/flowcore-water/homebrew-tap/Formula"
          for f in Formula/*.rb; do
            brew audit --strict "flowcore-water/tap/$(basename "$f" .rb)"
          done
